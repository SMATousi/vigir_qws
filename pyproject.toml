[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qws"
version = "0.1.0"
description = "Quantum weak supervision: structured data programming for segmentation as Ising/QUBO problems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "PyMaxflow>=1.3",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
anneal = ["dimod>=0.12", "dwave-system>=1.20", "dwave-neal>=0.6"]
gate = ["qiskit>=1.0", "qiskit-aer>=0.14"]
dev = ["pytest>=7"]

[project.scripts]
qws = "qws.cli:main"

[tool.setuptools.packages.find]
include = ["qws*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: longer-running statistical tests",
    "qpu: needs real quantum hardware credentials (never run in CI)",
]
addopts = "-m 'not qpu'"
